[project]
name = "transform-agents"
version = "0.1.0"
description = "Agentic autonomy over an AWS migration - Strands / AgentCore (PoC)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
agents = [
    "strands-agents>=0.1",
    "strands-agents-tools>=0.1",
    "mcp>=1.0",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pypdf>=4",
    "python-pptx>=0.6",
    "python-hcl2>=4",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "moto[dynamodb,logs,ssm]>=5",
    "openpyxl>=3.1",
    "python-hcl2>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "tools", "state", "dispatcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
